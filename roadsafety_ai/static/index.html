<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Hazard AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #21262d;
    --accent: #58a6ff; --red: #f85149; --orange: #d29922;
    --green: #3fb950; --text: #c9d1d9; --muted: #8b949e;
    --low: #3fb950; --moderate: #d29922; --heavy: #f0883e; --gridlock: #f85149;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px;
    border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  .badge { font-size: .7rem; background: var(--accent); color: #000;
    padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  #health-txt { margin-left: auto; font-size: .75rem; color: var(--muted); }

  main { display: grid; grid-template-columns: 360px 1fr; gap: 0; height: calc(100vh - 52px); }

  /* Left panel */
  .left-panel { background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; }
  .section { padding: 16px; border-bottom: 1px solid var(--border); }
  .section h2 { font-size: .72rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px; }

  /* Drop zone */
  #drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 28px 16px;
    text-align: center; cursor: pointer; transition: all .2s; }
  #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); background: rgba(88,166,255,.05); }
  #drop-zone svg { opacity: .35; display: block; margin: 0 auto 10px; }
  #drop-zone p { font-size: .82rem; color: var(--muted); }
  #drop-zone strong { color: var(--accent); }
  #file-name { margin-top: 8px; font-size: .75rem; color: var(--accent); min-height: 16px; }
  #file-input { display: none; }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 9px 12px; border-radius: 6px; border: none;
    cursor: pointer; font-size: .82rem; font-weight: 600; transition: opacity .15s; }
  button:hover { opacity: .85; } button:disabled { opacity: .35; cursor: not-allowed; }
  #btn-json  { background: var(--accent); color: #000; }
  #btn-img   { background: #388bfd; color: #000; }
  #btn-clear { background: var(--border); color: var(--text); flex: 0 0 auto; padding: 9px 14px; }

  .sample-row { display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: .78rem; color: var(--muted); }
  #sample-rate { width: 52px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 5px; font-size: .8rem; }
  #status-msg { font-size: .78rem; color: var(--muted); margin-top: 8px; min-height: 16px; }

  /* Traffic panel */
  #traffic-panel { display: none; }
  .density-bar { height: 8px; border-radius: 4px; background: var(--border);
    overflow: hidden; margin-bottom: 10px; }
  .density-fill { height: 100%; border-radius: 4px; transition: width .4s; }
  .density-low      { background: var(--low); }
  .density-moderate { background: var(--moderate); }
  .density-heavy    { background: var(--heavy); }
  .density-gridlock { background: var(--gridlock); }

  .traffic-row { display: flex; justify-content: space-between; align-items: center;
    font-size: .82rem; padding: 3px 0; }
  .traffic-val { font-weight: 700; color: var(--text); }

  .lights-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .light-chip { display: flex; align-items: center; gap: 5px; font-size: .75rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; }
  .light-dot { width: 10px; height: 10px; border-radius: 50%; }
  .light-red    .light-dot { background: #f85149; box-shadow: 0 0 6px #f85149; }
  .light-yellow .light-dot { background: #d29922; box-shadow: 0 0 6px #d29922; }
  .light-green  .light-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .light-unknown .light-dot { background: var(--muted); }

  /* Summary grid */
  #summary-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px; text-align: center; }
  .stat .n { font-size: 1.6rem; font-weight: 800; }
  .stat .l { font-size: .65rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .stat.s-total    .n { color: var(--accent); }
  .stat.s-pothole  .n { color: var(--red); }
  .stat.s-accident .n { color: var(--orange); }
  .stat.s-ped      .n { color: #b084f0; }
  .stat.s-critical .n { color: var(--red); }
  .stat.s-high     .n { color: var(--heavy); }

  /* Detections */
  #det-scroll { overflow-y: auto; flex: 1; }
  #det-list { display: flex; flex-direction: column; gap: 6px; padding: 16px; }
  .det-card { background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; border-left: 3px solid var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .det-card.pothole       { border-color: var(--red); }
  .det-card.accident      { border-color: var(--orange); }
  .det-card.pedestrian    { border-color: #b084f0; }
  .det-card.traffic_light { border-color: var(--green); }
  .det-name { font-weight: 600; font-size: .82rem; }
  .det-conf { font-size: .72rem; color: var(--muted); }
  .sev { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .sev-low      { background: #0d4429; color: #3fb950; }
  .sev-medium   { background: #3a1a00; color: #d29922; }
  .sev-high     { background: #3d1f00; color: #f0883e; }
  .sev-critical { background: #3d0b0b; color: #f85149; }

  /* Right panel — image/result */
  .right-panel { display: flex; flex-direction: column; overflow: hidden; }
  #img-area { flex: 1; display: flex; align-items: center; justify-content: center;
    background: #090c10; overflow: hidden; position: relative; }
  #preview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  #annotated-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  #placeholder-txt { color: var(--muted); font-size: .9rem; text-align: center; padding: 40px; }

  /* Spinner */
  #spinner { display: none; position: absolute; inset: 0;
    background: rgba(13,17,23,.7); align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 10; }
  .spin { width: 38px; height: 38px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #spin-msg { color: var(--muted); font-size: .82rem; }

  /* Timeline for video */
  #timeline { max-height: 320px; overflow-y: auto; padding: 16px; display: none; }
  .t-row { background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; margin-bottom: 6px; }
  .t-ts { font-size: .78rem; color: var(--accent); font-weight: 700; margin-bottom: 5px; }
  .t-info { font-size: .75rem; color: var(--muted); }

  .advice { font-size: .78rem; color: var(--muted); margin-top: 6px;
    padding: 6px 10px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }

  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
</style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
  </svg>
  <h1>Road Hazard AI</h1>
  <span class="badge">v2</span>
  <div id="health-txt">loading…</div>
</header>

<main>
  <!-- LEFT -->
  <div class="left-panel">

    <!-- Upload -->
    <div class="section">
      <h2>Upload</h2>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop an <strong>image</strong> or <strong>video</strong> here</p>
        <div id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept="image/*,video/*">

      <div class="btn-row">
        <button id="btn-json" disabled>Analyze</button>
        <button id="btn-img"  disabled>Annotated Image</button>
        <button id="btn-clear">✕</button>
      </div>
      <div class="sample-row">
        Video sample rate:
        <input type="number" id="sample-rate" value="5" min="1" max="30"> frames
      </div>
      <div id="status-msg"></div>
    </div>

    <!-- Traffic -->
    <div class="section" id="traffic-panel">
      <h2>Traffic Analysis</h2>
      <div class="density-bar"><div class="density-fill" id="density-fill" style="width:0%"></div></div>
      <div class="traffic-row"><span>Density</span>    <span class="traffic-val" id="t-density">—</span></div>
      <div class="traffic-row"><span>Vehicles</span>   <span class="traffic-val" id="t-vehicles">—</span></div>
      <div class="traffic-row"><span>Pedestrians</span><span class="traffic-val" id="t-peds">—</span></div>
      <div class="traffic-row"><span>Bicycles</span>   <span class="traffic-val" id="t-bikes">—</span></div>
      <div id="lights-row" class="lights-row"></div>
      <div class="advice" id="t-advice"></div>
    </div>

    <!-- Summary -->
    <div class="section">
      <h2>Hazard Summary</h2>
      <div id="summary-grid">
        <div class="stat s-total">   <div class="n" id="s-total">0</div>   <div class="l">Total</div></div>
        <div class="stat s-pothole"> <div class="n" id="s-pot">0</div>    <div class="l">Potholes</div></div>
        <div class="stat s-accident"><div class="n" id="s-acc">0</div>    <div class="l">Accidents</div></div>
        <div class="stat s-ped">     <div class="n" id="s-ped">0</div>    <div class="l">Pedestrians</div></div>
        <div class="stat s-critical"><div class="n" id="s-crit">0</div>   <div class="l">Critical</div></div>
        <div class="stat s-high">    <div class="n" id="s-high">0</div>   <div class="l">High</div></div>
      </div>
    </div>

    <!-- Detection list -->
    <div id="det-scroll">
      <div id="det-list"></div>
      <div id="timeline"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div id="img-area">
      <p id="placeholder-txt">Upload an image or video to start detection</p>
      <img id="preview" alt="preview">
      <img id="annotated-img" alt="annotated">
      <div id="spinner"><div class="spin"></div><div id="spin-msg">Analyzing…</div></div>
    </div>
  </div>
</main>

<script>
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const btnJson    = document.getElementById('btn-json');
const btnImg     = document.getElementById('btn-img');
const btnClear   = document.getElementById('btn-clear');
const preview    = document.getElementById('preview');
const annotated  = document.getElementById('annotated-img');
const spinner    = document.getElementById('spinner');
const spinMsg    = document.getElementById('spin-msg');
const statusMsg  = document.getElementById('status-msg');
const placeholder= document.getElementById('placeholder-txt');

let currentFile = null, isVideo = false;

// Health
fetch('/health').then(r => r.json()).then(d => {
  document.getElementById('health-txt').textContent = d.model;
}).catch(() => document.getElementById('health-txt').textContent = 'offline');

// Drag-drop
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

function setFile(file) {
  currentFile = file;
  isVideo = file.type.startsWith('video/');
  document.getElementById('file-name').textContent = file.name;
  btnJson.disabled = false;
  btnImg.disabled  = isVideo;
  clearResults();

  if (!isVideo) {
    const url = URL.createObjectURL(file);
    preview.src = url; preview.style.display = 'block';
    annotated.style.display = 'none';
    placeholder.style.display = 'none';
  } else {
    preview.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.textContent = `Video ready: ${file.name}`;
  }
}

btnClear.addEventListener('click', () => {
  currentFile = null; fileInput.value = '';
  document.getElementById('file-name').textContent = '';
  preview.style.display = 'none'; preview.src = '';
  annotated.style.display = 'none'; annotated.src = '';
  placeholder.style.display = 'block'; placeholder.textContent = 'Upload an image or video to start detection';
  btnJson.disabled = true; btnImg.disabled = true;
  clearResults(); statusMsg.textContent = '';
});

btnJson.addEventListener('click', async () => {
  if (!currentFile) return;
  setLoading(true, isVideo ? 'Processing video frames…' : 'Running AI detection…');
  const fd = new FormData();
  fd.append('file', currentFile);
  try {
    if (isVideo) {
      const sr = document.getElementById('sample-rate').value;
      const res = await fetch(`/detect/video?sample_rate=${sr}`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      renderVideo(await res.json());
    } else {
      const res = await fetch('/detect/image', { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      renderImage(await res.json());
    }
  } catch (e) { statusMsg.textContent = '⚠ ' + e.message; }
  finally { setLoading(false); }
});

btnImg.addEventListener('click', async () => {
  if (!currentFile || isVideo) return;
  setLoading(true, 'Generating annotated image…');
  const fd = new FormData(); fd.append('file', currentFile);
  try {
    const res = await fetch('/detect/image/annotated', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    annotated.src = URL.createObjectURL(blob);
    annotated.style.display = 'block';
    preview.style.display   = 'none';
    placeholder.style.display = 'none';
  } catch (e) { statusMsg.textContent = '⚠ ' + e.message; }
  finally { setLoading(false); }
});

// ---- Render functions ----

function renderImage(data) {
  renderTraffic(data.traffic);
  const s = data.summary;
  renderSummary(s.total, s.potholes, s.accidents, s.pedestrians, s.critical, s.high);
  renderDetList(data.detections);
  document.getElementById('timeline').style.display = 'none';
}

function renderVideo(data) {
  // Use traffic from peak frame
  if (data.peak_traffic) renderTrafficPeak(data.peak_traffic);
  const s = data.overall_summary;
  renderSummary(s.total, s.potholes, s.accidents, s.pedestrians, s.critical, s.high);
  renderTimeline(data.results);
  document.getElementById('det-list').innerHTML = '';
}

function renderTraffic(t) {
  if (!t) return;
  document.getElementById('traffic-panel').style.display = 'block';
  const fill = document.getElementById('density-fill');
  fill.style.width = `${Math.round(t.density_score * 100)}%`;
  fill.className = `density-fill density-${t.density}`;
  document.getElementById('t-density').textContent  = t.density.toUpperCase();
  document.getElementById('t-density').style.color  = densityColor(t.density);
  document.getElementById('t-vehicles').textContent = t.vehicle_count;
  document.getElementById('t-peds').textContent     = t.pedestrian_count;
  document.getElementById('t-bikes').textContent    = t.bicycle_count;
  document.getElementById('t-advice').textContent   = t.congestion_advice;
  renderLights(t.traffic_lights || []);
}

function renderTrafficPeak(peak) {
  document.getElementById('traffic-panel').style.display = 'block';
  document.getElementById('t-density').textContent = (peak.density || '').toUpperCase();
  document.getElementById('t-density').style.color = densityColor(peak.density);
  document.getElementById('t-vehicles').textContent = peak.vehicle_count;
}

function renderLights(lights) {
  const row = document.getElementById('lights-row');
  row.innerHTML = '';
  lights.forEach(tl => {
    const chip = document.createElement('div');
    chip.className = `light-chip light-${tl.state}`;
    chip.innerHTML = `<div class="light-dot"></div> ${tl.state}`;
    row.appendChild(chip);
  });
}

function renderSummary(total, potholes, accidents, peds, critical, high) {
  const g = document.getElementById('summary-grid');
  g.style.display = 'grid';
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-pot').textContent   = potholes;
  document.getElementById('s-acc').textContent   = accidents;
  document.getElementById('s-ped').textContent   = peds;
  document.getElementById('s-crit').textContent  = critical;
  document.getElementById('s-high').textContent  = high;
}

function renderDetList(dets) {
  const list = document.getElementById('det-list');
  list.innerHTML = '';
  if (!dets.length) { list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:12px;font-size:.8rem">No hazards detected</p>'; return; }
  dets.forEach(d => list.appendChild(detCard(d)));
}

function renderTimeline(frames) {
  const tl = document.getElementById('timeline');
  tl.style.display = 'block';
  tl.innerHTML = '';
  if (!frames.length) { tl.innerHTML = '<p style="color:var(--muted);text-align:center;font-size:.8rem">No hazards in video</p>'; return; }
  frames.forEach(f => {
    const row = document.createElement('div'); row.className = 't-row';
    const motion = f.motion_score > 0.4 ? ` · motion:${f.motion_score}` : '';
    row.innerHTML = `<div class="t-ts">⏱ ${f.timestamp_s}s (frame ${f.frame})${motion}</div>
      <div class="t-info">${f.summary.potholes} pothole${f.summary.potholes!==1?'s':''} · ${f.summary.accidents} accident${f.summary.accidents!==1?'s':''} · traffic: ${(f.traffic||{}).density||'—'}</div>`;
    f.detections.forEach(d => row.appendChild(detCard(d)));
    tl.appendChild(row);
  });
}

function detCard(d) {
  const el = document.createElement('div');
  el.className = `det-card ${d.category}`;
  el.innerHTML = `<div><div class="det-name">${d.class_name.replace(/_/g,' ')}</div>
    <div class="det-conf">${(d.confidence*100).toFixed(0)}% confidence</div></div>
    <div><span class="sev sev-${d.severity}">${d.severity}</span></div>`;
  return el;
}

function densityColor(d) {
  return {'low':'#3fb950','moderate':'#d29922','heavy':'#f0883e','gridlock':'#f85149'}[d] || 'var(--text)';
}

function setLoading(v, msg = '') {
  spinner.style.display = v ? 'flex' : 'none';
  spinMsg.textContent   = msg;
  btnJson.disabled = v; btnImg.disabled = v || isVideo;
  if (!v) statusMsg.textContent = '';
}

function clearResults() {
  document.getElementById('det-list').innerHTML = '';
  document.getElementById('timeline').innerHTML = ''; document.getElementById('timeline').style.display = 'none';
  document.getElementById('summary-grid').style.display = 'none';
  document.getElementById('traffic-panel').style.display = 'none';
}
</script>
</body>
</html>
